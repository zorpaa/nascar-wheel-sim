    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCAR Simulator</title>

    <link rel="stylesheet" href="style.css">
    <script src="data/tracks.js"></script>
    <script src="data/schedule.js"></script>
    <script src="finishTypes.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">

    <h1>NASCAR Simulator</h1>

    <div class="controls">

        <label>Series</label>

        <select id="series">
            <option value="cup">Cup</option>
            <option value="oreilly">O'Reilly</option>
            <option value="truck">Truck</option>
        </select>

        <select id="race">
        </select>
        
        <select id="track"></select>

        <button id="runRace">Run Race</button>

    </div>

    <div id="winnerCard" class="winner hidden">
        <div class="trophy">🏆</div>
        <h2>RACE WINNER</h2>
        <div class="winnerDriver">
            <div id="winnerNumber" class="winnerNumber">--</div>
            <h1 id="winnerName">---</h1>
        </div>
        <h3 id="winnerTeam"></h3>
        <p id="finishType"></p>
        <p id="finishType"></p>

        <div class="winnerRaceInfo">
            <div class="raceInfoItem">
                <span>RACE</span>
                <strong id="raceName">---</strong>
            </div>
        
            <div class="raceInfoItem">
                <span>TRACK</span>
                <strong id="trackName">---</strong>
            </div>
        
            <div class="raceInfoItem">
                <span>TRACK TYPE</span>
                <strong id="trackType">---</strong>
            </div>
        </div>
    </div>

    <div class="summary">

    <h2>Race Summary</h2>

    <p id="fieldSize"></p>
    <p id="openEntries"></p>
    <p id="openList"></p>

</div>


<div class="results">

    <h2>Results</h2>

    <table>

        <thead>
            <tr>
                <th>Pos</th>
                <th>Driver</th>
                <th>Team</th>
            </tr>
        </thead>

        <tbody id="resultsTable"></tbody>

    </table>

</div>

    <div class="log">

        <h2>Race Log</h2>

        <pre id="raceLog"></pre>

    </div>

</div>

</body>
</html>
