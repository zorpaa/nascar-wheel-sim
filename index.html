    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASCAR Simulator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="container">

    <h1>NASCAR Simulator</h1>

    <div class="controls">

        <label>Series</label>

        <select id="series">
            <option value="cup">Cup</option>
            <option value="oreilly">O'Reilly</option>
            <option value="truck">Truck</option>
        </select>

        <select id="track">
            <option value="Daytona">Daytona</option>
            <option value="Talladega">Talladega</option>
            <option value="Bristol">Bristol</option>
            <option value="Martinsville">Martinsville</option>
            <option value="Sonoma">Sonoma</option>
            <option value="WatkinsGlen">Watkins Glen</option>
            <option value="Charlotte">Charlotte</option>
        </select>

        <button id="runRace">Run Race</button>

    </div>

    <div id="winnerCard" class="winner hidden">

        <div class="trophy">🏆</div>

        <h2>RACE WINNER</h2>

        <h1 id="winnerName">---</h1>

        <h3 id="winnerTeam"></h3>

        <p id="finishType"></p>

    </div>

    <div class="summary">

    <h2>Race Summary</h2>

    <p id="fieldSize"></p>
    <p id="openEntries"></p>
    <p id="openList"></p>

</div>


<div class="results">

    <h2>Results</h2>

    <table>

        <thead>
            <tr>
                <th>Pos</th>
                <th>Driver</th>
                <th>Team</th>
            </tr>
        </thead>

        <tbody id="resultsTable"></tbody>

    </table>

</div>

    <div class="log">

        <h2>Race Log</h2>

        <pre id="raceLog"></pre>

    </div>

</div>

</body>
</html>
